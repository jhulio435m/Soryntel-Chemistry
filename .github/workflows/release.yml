name: Publicar versión

# Publicar: subir la versión en soryntel/Cargo.toml ([workspace.package]),
# hacer commit y empujar la etiqueta correspondiente:
#   git tag v0.2.0 && git push origin v0.2.0
# Con workflow_dispatch se compilan los paquetes como artefactos sin publicar.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Versión
    # Solo el fork publica versiones (y la web lee sus descargas de ahí);
    # en NnandoO/Soryntel-Chemistry el flujo se omite para no duplicar trabajo.
    # El resto de trabajos depende de este y se omite con él.
    if: github.repository == 'jhulio435m/Soryntel-Chemistry'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: v
        name: Leer Cargo.toml y comprobar la etiqueta
        run: |
          version=$(awk '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[" ]/,"",$0); split($0,a,"="); print a[2]; exit}' soryntel/Cargo.toml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con la versión ${version} de soryntel/Cargo.toml"
            exit 1
          fi
          echo "Versión ${version}"

  linux:
    name: Linux (.run y .tar.gz)
    needs: version
    # 22.04 (glibc 2.35) para que el binario funcione en distribuciones no tan recientes.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: soryntel
          key: release-linux
      - name: Tests
        working-directory: soryntel
        run: cargo test --workspace --locked
      - &prepare_sdb
        name: Preparar SoryntelDB
        id: prepare_sdb
        shell: bash
        env:
          SORYNTEL_SDB_S3_URI: ${{ secrets.SORYNTEL_SDB_S3_URI }}
          SORYNTEL_SDB_SHA256: ${{ secrets.SORYNTEL_SDB_SHA256 }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          db_dir="$(mktemp -d "$RUNNER_TEMP/soryntel-db.XXXXXX")/Databases"
          mkdir -p "$db_dir"
          echo "SORYNTEL_SDB_DIR=$db_dir" >> "$GITHUB_ENV"
          if [[ -z "$SORYNTEL_SDB_S3_URI" || -z "$SORYNTEL_SDB_SHA256" ||
                -z "$AWS_ROLE_ARN" || -z "$AWS_REGION" ]]; then
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              echo "::error::Faltan secretos de SoryntelDB para empaquetar la versión."
              exit 1
            fi
            echo "::warning::Faltan secretos de SoryntelDB. Se empaquetará sin la base."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - &configure_aws
        name: Asumir el rol de AWS mediante OIDC
        id: configure_aws
        if: steps.prepare_sdb.outputs.ready == 'true'
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: soryntel-release-${{ github.run_id }}
      - &download_sdb
        name: Descargar y verificar SoryntelDB
        if: steps.prepare_sdb.outputs.ready == 'true'
        shell: bash
        env:
          AWS_ROLE_OUTCOME: ${{ steps.configure_aws.outcome }}
          SORYNTEL_SDB_S3_URI: ${{ secrets.SORYNTEL_SDB_S3_URI }}
          SORYNTEL_SDB_SHA256: ${{ secrets.SORYNTEL_SDB_SHA256 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [[ "$AWS_ROLE_OUTCOME" != success ]]; then
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_TYPE" == branch ]]; then
              echo "::warning::No se pudo asumir el rol de AWS. Se empaquetará sin la base."
              exit 0
            fi
            echo "::error::No se pudo asumir el rol de AWS para empaquetar la versión."
            exit 1
          fi
          if [[ "$SORYNTEL_SDB_S3_URI" != s3://*/* || ! "$SORYNTEL_SDB_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::La URI de S3 o el SHA-256 de SoryntelDB no son válidos."
            exit 1
          fi
          db_dir="$SORYNTEL_SDB_DIR"
          tmp=$(mktemp "$db_dir/.soryntel.XXXXXX")
          trap 'rm -f "$tmp"' EXIT
          aws s3 cp "$SORYNTEL_SDB_S3_URI" "$tmp" --region "$AWS_REGION" --only-show-errors
          if ! [[ -s "$tmp" ]] ||
             ! printf '%s  %s\n' "${SORYNTEL_SDB_SHA256,,}" "$tmp" | sha256sum --check --status; then
            echo "::error::La base descargada está vacía o no coincide con el SHA-256 esperado."
            exit 1
          fi
          mv "$tmp" "$db_dir/soryntel.sdb"
      - name: Compilar y empaquetar
        run: soryntel/packaging/build-releases.sh linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-linux
          path: |
            soryntel/dist/Soryntel-Chemistry-*-linux-x86_64.tar.gz
            soryntel/dist/Soryntel-Chemistry-*-linux-x86_64.run
          if-no-files-found: error
      - name: Binario para el paquete de Arch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-binary
          path: soryntel/target/release/soryntel-desktop
          if-no-files-found: error

  windows:
    name: Windows (instalador y portable)
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain MinGW y NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nsis zip
      - run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: soryntel
          key: release-windows
      - *prepare_sdb
      - *configure_aws
      - *download_sdb
      - name: Compilar y empaquetar
        run: soryntel/packaging/build-releases.sh windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-windows
          path: |
            soryntel/dist/Soryntel-Chemistry-*-win64-setup.exe
            soryntel/dist/Soryntel-Chemistry-*-win64-portable.zip
          if-no-files-found: error

  arch:
    name: Arch Linux (.pkg.tar.zst)
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: linux-binary
          path: soryntel/target/release
      - *prepare_sdb
      - *configure_aws
      - *download_sdb
      - name: Empaquetar con makepkg
        run: |
          chmod 755 soryntel/target/release/soryntel-desktop
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$SORYNTEL_SDB_DIR:/Databases:ro" \
            -e SORYNTEL_SDB_DIR=/Databases -w /workspace archlinux:base-devel \
            bash -euc 'useradd -m -u "$1" builder
              runuser -u builder -- soryntel/packaging/build-releases.sh arch' bash "$(id -u)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-arch
          path: soryntel/dist/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publicar en GitHub Releases
    needs: [version, linux, windows, arch]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Comprobar los archivos que ofrece la web
        run: |
          cd dist
          expected=(
            "Soryntel-Chemistry-${VERSION}-win64-setup.exe"
            "Soryntel-Chemistry-${VERSION}-win64-portable.zip"
            "Soryntel-Chemistry-${VERSION}-linux-x86_64.run"
            "Soryntel-Chemistry-${VERSION}-linux-x86_64.tar.gz"
            "soryntel-chemistry-${VERSION}-1-x86_64.pkg.tar.zst"
          )
          for f in "${expected[@]}"; do
            [[ -s "$f" ]] || { echo "::error::Falta $f"; exit 1; }
          done
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          # Solo se publican los paquetes de esta versión: nada de carpetas ni
          # restos de otras versiones que pudieran llegar en los artefactos.
          mkdir -p ../release
          mv "${expected[@]}" SHA256SUMS.txt ../release/
          ls -lh ../release
      - name: Crear o actualizar la versión
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --title "Soryntel Chemistry ${VERSION}" --generate-notes --verify-tag
          fi
      - uses: actions/setup-node@v5
        if: github.ref_type == 'tag'
        with:
          node-version: 26
      - name: Verificar que la web puede enlazar cada descarga
        if: github.ref_type == 'tag'
        run: node web/scripts/sync-release.mjs --tag "${GITHUB_REF_NAME}" --check
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
      # Cloudflare Pages construye la web desde el repositorio y, al compilar,
      # toma descargas y tamaños de la última versión publicada. Una etiqueta no
      # es un commit, así que se pide la reconstrucción con un Deploy Hook.
      - name: Reconstruir la web en Cloudflare Pages
        if: github.ref_type == 'tag' && env.CF_PAGES_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK" > /dev/null
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
      - name: Artefactos (ejecución manual)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: soryntel-chemistry-${{ env.VERSION }}
          path: release/*
          if-no-files-found: error
